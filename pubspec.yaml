name: vitatrack
description: "VitaTrack — suivi nutritionnel Flutter + Firebase, adapté au contexte camerounais."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  intl: ^0.20.2
  image_picker: ^1.2.1
  http: ^1.2.0
  supabase_flutter: ^2.8.0
  # Firebase n'est conservé que pour le push (FCM). Auth/données/images -> Supabase.
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  pdf: ^3.11.3
  printing: ^5.14.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/foods/
    - assets/images/illustrations/
    - assets/icons/
